model:
  model_id: audio
  rope_cls: audio
  n_layers: 28
  n_heads: 24
  d_model: 1536
  d_text: 0           # unused, satisfies ModelConfig
  channels: 64        # stable audio VAE latent channels
  patch_size: 1       # over latent frames
  sample_size: [1, 1] # unused, satisfies ModelConfig
  window_length: 10.0 # seconds of audio per sample
  sample_rate: 21.2   # latent fps (44100 / VAE compression ratio ~2075)
  x0_mode: False
  noise_scale: 1.0
  mlp_ratio: 4

train:
  trainer_id: audio
  data_id: audio_dir_loader
  data_kwargs:
    source: /path/to/your/mp4/dataset
    window_length: 20.0
    sample_rate: 44100  # raw audio SR for the data loader
  target_batch_size: 256
  batch_size: 32
  epochs: 1000
  opt: Muon
  opt_kwargs:
    lr: 1.0e-5
    momentum: 0.95
    adamw_lr: 1.0e-4
    adamw_wd: 1.0e-2
    adamw_eps: 1.0e-8
    adamw_betas: [0.95, 0.95]
    adamw_keys:
      - core.proj_in
      - core.proj_out
      - core.norm_out
      - core.ts_embed
      - .adaln1
      - .adaln2
      - .gate1
      - .gate2
  checkpoint_dir: checkpoints/audio_baseline
  resume_ckpt: null
  sample_interval: 1000
  save_interval: 5000
  sampler_id: audio
  sampling_steps: 50
  n_samples: 8

wandb:
  name: your_wandb_entity
  project: owl-audio-gen
  run_name: audio-baseline

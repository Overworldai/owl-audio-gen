model:
  model_id: audio
  rope_cls: audio
  n_layers: 24
  n_heads: 24
  d_model: 1536
  d_text: 0           # unused, satisfies ModelConfig
  channels: 64        # stable audio VAE latent channels
  patch_size: 1       # over latent frames
  sample_size: [1, 1] # unused, satisfies ModelConfig
  window_length: 10.0 # seconds of audio per sample
  sample_rate: 25     # latent fps 
  x0_mode: False
  noise_scale: 1.0
  mlp_ratio: 4
  video_channels: 0   # unused, satisfies ModelConfig

train:
  trainer_id: audio
  data_id: audio_dir_loader
  data_kwargs:
    source: /workspace/dataset/source
    window_length: 10.0
    sample_rate: 48000  # raw audio SR for the data loader
  target_batch_size: 48
  batch_size: 24
  epochs: 1000
  opt: Muon
  opt_kwargs:
    lr: 5.0e-5
    momentum: 0.95
    adamw_lr: 1.0e-4
    adamw_wd: 1.0e-2
    adamw_eps: 1.0e-8
    adamw_betas: [0.95, 0.95]
    adamw_keys:
      - core.proj_in
      - core.proj_out
      - core.norm_out
      - core.ts_embed
      - .adaln1
      - .adaln2
      - .gate1
      - .gate2
  checkpoint_dir: checkpoints/audio_baseline
  resume_ckpt: null
  sample_interval: 400
  save_interval: 5000
  sampler_id: audio
  sampling_steps: 50
  n_samples: 8
  vae_id: ace-step1.5    # audio VAE id

wandb:
  name: its-nmt05
  project: owl-audio-gen
  run_name: audio-baseline
